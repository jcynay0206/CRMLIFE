<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>JC Nay Insurance — CRM Pipeline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
:root{
  --bg:#0f1117;--surface:#1a1d2e;--surface2:#232640;--border:#2e3154;
  --text:#e8eaf6;--muted:#8b8fa8;--accent:#6c63ff;
  --green:#4caf50;--yellow:#ffc107;--red:#f44336;--blue:#2196f3;--orange:#ff9800;
}
body{background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:800}.logo span{color:var(--accent)}
.header-right{display:flex;gap:8px;align-items:center}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:.2s;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#5a52d5}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.view-toggle{display:flex;gap:4px;background:var(--surface2);border-radius:8px;padding:3px}
.view-btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--muted);transition:.15s}
.view-btn.active{background:var(--accent);color:#fff}
.stats-bar{display:flex;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.stat{background:var(--surface2);border-radius:8px;padding:10px 16px;border:1px solid var(--border)}
.stat-val{font-size:22px;font-weight:800;color:var(--accent)}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.toolbar{padding:12px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border)}
.search-box{flex:1;min-width:180px;position:relative}
.search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;color:var(--text);font-size:13px}
.search-box input:focus{outline:none;border-color:var(--accent)}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;cursor:pointer}
select:focus{outline:none;border-color:var(--accent)}
.kanban{display:flex;gap:12px;padding:20px 24px;overflow-x:auto;min-height:calc(100vh - 220px);align-items:flex-start}
.kanban::-webkit-scrollbar{height:6px}
.kanban::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.column{background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:230px;max-width:230px;display:flex;flex-direction:column;max-height:calc(100vh - 240px)}
.column.drag-over{border-color:var(--accent)}
.col-header{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.col-count{background:var(--surface2);border-radius:20px;padding:2px 7px;font-size:11px;color:var(--muted)}
.col-cards{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1}
.col-cards::-webkit-scrollbar{width:3px}
.col-cards::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px;cursor:grab;transition:.15s;user-select:none}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card.dragging{opacity:.3}
.card-name{font-size:13px;font-weight:700;margin-bottom:3px}
.card-phone{font-size:11px;color:var(--muted);margin-bottom:5px}
.card-cita{font-size:10px;background:#2a1b3a;color:#ce93d8;padding:2px 7px;border-radius:20px;display:inline-block;margin-bottom:5px}
.card-tags{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:7px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.tag-iul{background:#3d2b6b;color:#bb86fc}
.tag-term{background:#1b3a6b;color:#64b5f6}
.tag-med{background:#1b4a3a;color:#80cbc4}
.tag-salud{background:#4a2b1b;color:#ffb74d}
.tag-anu{background:#3a1b4a;color:#f48fb1}
.card-actions{display:flex;gap:5px}
.card-btn{flex:1;padding:5px;border-radius:6px;border:none;cursor:pointer;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:3px;text-decoration:none;transition:.15s}
.card-btn-call{background:#1b3a1b;color:#81c784}
.card-btn-wa{background:#1b3a2b;color:#4caf50}
.card-btn-note{background:var(--surface);color:var(--muted)}
.priority-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.p-high{background:var(--red)}.p-med{background:var(--yellow)}.p-low{background:var(--green)}
.empty-col{text-align:center;padding:16px;color:var(--muted);font-size:11px}
.table-view{padding:20px 24px;display:none}
.table-view.active{display:block}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
thead{background:var(--surface2)}
th{padding:11px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border)}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.stage-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.cal-view{padding:20px 24px;display:none}
.cal-view.active{display:block}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-top h2{font-size:18px;font-weight:800}
.cal-nav{display:flex;gap:8px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px}
.cal-day{background:var(--surface);border:1px solid var(--border);border-radius:10px;min-height:110px;padding:10px}
.cal-day.today{border-color:var(--accent)}
.cal-day-label{font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.cal-day-num{font-size:18px;font-weight:800;margin-bottom:6px}
.cal-day.today .cal-day-num{color:var(--accent)}
.cal-event{background:#2d2b6b;border-left:3px solid var(--accent);border-radius:5px;padding:4px 6px;margin-bottom:4px;cursor:pointer;font-size:11px}
.cal-event:hover{background:#3d3b8b}
.cal-event-name{font-weight:700;margin-bottom:1px}
.cal-event-time{color:var(--muted);font-size:10px}
.upcoming-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.upcoming-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.upcoming-item.soon{border-color:var(--orange)}
.upcoming-item.very-soon{border-color:var(--red);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,67,54,.3)}50%{box-shadow:0 0 0 6px rgba(244,67,54,0)}}
.upcoming-date-box{background:var(--surface2);border-radius:8px;padding:8px 12px;text-align:center;min-width:56px}
.upcoming-date-day{font-size:22px;font-weight:800;line-height:1}
.upcoming-date-mon{font-size:10px;color:var(--muted);text-transform:uppercase}
.upcoming-info{flex:1}
.upcoming-name{font-weight:700;font-size:14px;margin-bottom:2px}
.upcoming-sub{font-size:12px;color:var(--muted)}
.upcoming-actions{display:flex;gap:6px}
.section-div{background:var(--surface2);border-radius:8px;padding:9px 13px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.no-citas{text-align:center;padding:40px;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:17px;font-weight:800}
.modal-close{background:var(--surface2);border:none;color:var(--muted);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--text)}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.form-group input,.form-group select,.form-group textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;width:100%}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.modal-actions{display:flex;gap:7px}
.mac-btn{flex:1;padding:9px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;transition:.2s}
.mac-call{background:#1b3a1b;color:#81c784}.mac-call:hover{background:#2e5c2e}
.mac-wa{background:#1b3a2b;color:#4caf50}.mac-wa:hover{background:#2e5c3e}
.mac-email{background:#1b2a3a;color:#64b5f6}.mac-email:hover{background:#2e3e5c}
.notes-section{background:var(--surface2);border-radius:9px;padding:12px}
.notes-section h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.note-item{background:var(--surface);border-radius:7px;padding:9px;margin-bottom:6px;font-size:12px;line-height:1.5}
.note-date{font-size:10px;color:var(--muted);margin-top:3px}
.add-note{display:flex;gap:7px;margin-top:7px}
.add-note input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px}
.add-note input:focus{outline:none;border-color:var(--accent)}
.add-note button{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 11px;cursor:pointer;font-size:12px;font-weight:700}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--orange);border-radius:12px;padding:14px 18px;z-index:999;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-title{font-weight:700;font-size:14px;color:var(--orange);margin-bottom:4px}
.toast-body{font-size:12px;color:var(--muted)}
.toast-close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:16px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-badge{font-size:10px;color:var(--green);display:flex;align-items:center;gap:4px}
.sync-badge.saving{color:var(--yellow)}
</style>
</head>
<body>

<div class="header">
  <div class="logo">JC NAY <span>Insurance</span> <span style="font-size:11px;color:var(--muted);font-weight:400">CRM</span></div>
  <div class="header-right">
    <span class="sync-badge" id="syncBadge">🟢 Sincronizado</span>
    <div class="view-toggle">
      <button class="view-btn active" onclick="setView('kanban')">⊞ Pipeline</button>
      <button class="view-btn" onclick="setView('table')">☰ Tabla</button>
      <button class="view-btn" onclick="setView('calendar')">📅 Citas</button>
    </div>
    <button class="btn btn-primary" onclick="openNewLead()">+ Nuevo Lead</button>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="toolbar" id="mainToolbar">
  <div class="search-box"><span class="si">🔍</span><input type="text" id="searchInput" placeholder="Buscar nombre, teléfono, email..." oninput="renderAll()"/></div>
  <select id="filterProduct" onchange="renderAll()">
    <option value="">Todos los productos</option>
    <option>IUL</option><option>Término</option><option>Medicare</option><option>Salud</option><option>Anualidad</option>
  </select>
  <select id="filterPriority" onchange="renderAll()">
    <option value="">Todas las prioridades</option>
    <option>Alta</option><option>Media</option><option>Baja</option>
  </select>
</div>

<div id="kanbanView" style="display:flex">
  <div id="loadingState" class="loading"><div class="spinner"></div><span>Cargando leads desde Firebase...</span></div>
  <div class="kanban" id="kanbanBoard" style="display:none"></div>
</div>
<div class="table-view" id="tableView"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Producto</th><th>Etapa</th><th>Cita</th><th>Prioridad</th><th>Acciones</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="cal-view" id="calendarView">
  <div class="cal-top"><h2 id="calTitle"></h2><div class="cal-nav">
    <button class="btn btn-ghost" onclick="changeWeek(-1)">← Anterior</button>
    <button class="btn btn-ghost" onclick="changeWeek(0)">Hoy</button>
    <button class="btn btn-ghost" onclick="changeWeek(1)">Siguiente →</button>
  </div></div>
  <div class="cal-week" id="calWeek"></div>
  <div class="section-div">📋 Próximas citas</div>
  <div class="upcoming-list" id="upcomingList"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="leadModal">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Nuevo Lead</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div id="modalActions" class="modal-actions" style="display:none">
        <a id="btnCall" class="mac-btn mac-call" href="#">📞 Llamar</a>
        <a id="btnWa" class="mac-btn mac-wa" target="_blank" href="#">💬 WhatsApp</a>
        <a id="btnEmail" class="mac-btn mac-email" href="#">✉️ Email</a>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Nombre *</label><input id="fName" placeholder="Juan Pérez"/></div>
        <div class="form-group"><label>Teléfono *</label><input id="fPhone" placeholder="+1 (908) 000-0000"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input id="fEmail" placeholder="juan@email.com"/></div>
        <div class="form-group"><label>Producto</label>
          <select id="fProduct"><option>IUL</option><option>Término</option><option>Medicare</option><option>Salud</option><option>Anualidad</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Etapa</label>
          <select id="fStage" onchange="toggleCitaFields()">
            <option value="0">🆕 Nuevo Lead</option><option value="1">📞 Contactado</option>
            <option value="2">📅 Cita Agendada</option><option value="3">💼 Presentación</option>
            <option value="4">📋 Aplicación</option><option value="5">🔍 Underwriting</option>
            <option value="6">✅ Póliza Emitida</option><option value="7">❌ Perdido</option>
          </select>
        </div>
        <div class="form-group"><label>Prioridad</label>
          <select id="fPriority"><option>Alta</option><option selected>Media</option><option>Baja</option></select>
        </div>
      </div>
      <div id="citaFields" style="display:none;background:var(--surface2);border-radius:9px;padding:12px;border:1px solid var(--accent)">
        <div style="font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">📅 Detalles de la Cita</div>
        <div class="form-row">
          <div class="form-group"><label>Fecha</label><input type="date" id="fCitaDate"/></div>
          <div class="form-group"><label>Hora</label><input type="time" id="fCitaTime"/></div>
        </div>
        <div class="form-group"><label>Tipo</label>
          <select id="fCitaType"><option>Videollamada (Zoom)</option><option>Llamada telefónica</option><option>Presencial</option><option>WhatsApp</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Cobertura</label><input id="fCoverage" placeholder="$500,000"/></div>
        <div class="form-group"><label>Prima</label><input id="fPremium" placeholder="$150/mes"/></div>
      </div>
      <div class="form-group"><label>Fuente</label>
        <select id="fSource"><option>Facebook Ads</option><option>Instagram</option><option>Referido</option><option>WhatsApp</option><option>Llamada fría</option><option>Otro</option></select>
      </div>
      <div class="form-group"><label>Notas</label><textarea id="fNotes" placeholder="Detalles, necesidades, objeciones..."></textarea></div>
      <div id="notesSection" class="notes-section" style="display:none">
        <h4>📝 Historial de notas</h4>
        <div id="notesList"></div>
        <div class="add-note"><input id="newNoteInput" placeholder="Agregar nota..."/><button onclick="addNote()">+ Agregar</button></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="btnDelete" onclick="deleteLead()" style="display:none">🗑 Eliminar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveLead()">💾 Guardar</button>
    </div>
  </div>
</div>
<div id="toastContainer"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmwyHm36KRG1gy5ucIeWIT1f_xR3HEuh8",
  authDomain: "fit-app-779ed.firebaseapp.com",
  projectId: "fit-app-779ed",
  storageBucket: "fit-app-779ed.firebasestorage.app",
  messagingSenderId: "18874470829",
  appId: "1:18874470829:web:5071591d6e24d1aa019124"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = collection(db, "jcnay_leads");

const STAGES=[
  {id:0,label:'🆕 Nuevo Lead',color:'#6c63ff',bg:'#2d2b6b'},
  {id:1,label:'📞 Contactado',color:'#2196f3',bg:'#1b2a4a'},
  {id:2,label:'📅 Cita Agendada',color:'#ff9800',bg:'#3a2a1b'},
  {id:3,label:'💼 Presentación',color:'#9c27b0',bg:'#2a1b3a'},
  {id:4,label:'📋 Aplicación',color:'#00bcd4',bg:'#1b2e30'},
  {id:5,label:'🔍 Underwriting',color:'#ff5722',bg:'#3a1b1b'},
  {id:6,label:'✅ Póliza Emitida',color:'#4caf50',bg:'#1b3a1b'},
  {id:7,label:'❌ Perdido',color:'#f44336',bg:'#3a1b1b'},
];
const PTAG={IUL:'tag-iul','Término':'tag-term',Medicare:'tag-med',Salud:'tag-salud',Anualidad:'tag-anu'};
const MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

let leads=[], editingId=null, editingDocId=null, dragId=null, dragDocId=null;
let currentView='kanban', weekOffset=0, notifiedIds=new Set();

function setSyncBadge(state){
  const b=document.getElementById('syncBadge');
  if(state==='saving'){b.textContent='🟡 Guardando...';b.className='sync-badge saving';}
  else{b.textContent='🟢 Sincronizado';b.className='sync-badge';}
}

// Real-time listener
const q=query(COL, orderBy("created","desc"));
onSnapshot(q, snap=>{
  leads=snap.docs.map(d=>({...d.data(), id:d.id}));
  document.getElementById('loadingState').style.display='none';
  document.getElementById('kanbanBoard').style.display='flex';
  renderAll();
}, err=>{
  document.getElementById('loadingState').innerHTML='<span style="color:var(--red)">⚠️ Error de conexión. Verifica las reglas de Firestore.</span>';
});

function filtered(){
  const q2=document.getElementById('searchInput').value.toLowerCase();
  const prod=document.getElementById('filterProduct').value;
  const pri=document.getElementById('filterPriority').value;
  return leads.filter(l=>
    (!q2||l.name.toLowerCase().includes(q2)||l.phone.includes(q2)||(l.email||'').toLowerCase().includes(q2))&&
    (!prod||l.product===prod)&&(!pri||l.priority===pri)
  );
}

function renderStats(){
  const total=leads.length;
  const citas=leads.filter(l=>l.stage===2&&l.citaDate).length;
  const closed=leads.filter(l=>l.stage===6).length;
  const high=leads.filter(l=>l.priority==='Alta'&&l.stage<6).length;
  const pipeline=leads.filter(l=>l.stage>0&&l.stage<6).length;
  document.getElementById('statsBar').innerHTML=`
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-label">Total Leads</div></div>
    <div class="stat"><div class="stat-val" style="color:#ff9800">${citas}</div><div class="stat-label">Citas</div></div>
    <div class="stat"><div class="stat-val" style="color:#2196f3">${pipeline}</div><div class="stat-label">En Pipeline</div></div>
    <div class="stat"><div class="stat-val" style="color:#4caf50">${closed}</div><div class="stat-label">Pólizas</div></div>
    <div class="stat"><div class="stat-val" style="color:#f44336">${high}</div><div class="stat-label">Alta Prioridad</div></div>`;
}

function renderKanban(){
  const data=filtered();
  const board=document.getElementById('kanbanBoard');
  board.innerHTML='';
  STAGES.forEach(stage=>{
    const cards=data.filter(l=>l.stage===stage.id);
    const col=document.createElement('div');
    col.className='column';col.dataset.stage=stage.id;
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drag-over');dropLead(stage.id);});
    col.innerHTML=`
      <div class="col-header">
        <div class="col-title" style="color:${stage.color}">${stage.label}</div>
        <span class="col-count">${cards.length}</span>
      </div>
      <div class="col-cards">
        ${!cards.length?'<div class="empty-col">Sin leads</div>':''}
        ${cards.map(l=>cardHTML(l)).join('')}
      </div>`;
    board.appendChild(col);
  });
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',()=>{dragId=card.dataset.id;card.classList.add('dragging');});
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });
}

function cardHTML(l){
  const pc=l.priority==='Alta'?'p-high':l.priority==='Media'?'p-med':'p-low';
  const citaTag=l.citaDate?`<div class="card-cita">📅 ${fmtDate(l.citaDate)} ${l.citaTime||''}</div>`:'';
  return`<div class="card" draggable="true" data-id="${l.id}" onclick="window._openLead('${l.id}')">
    <div class="card-name"><span class="priority-dot ${pc}"></span>${l.name}</div>
    <div class="card-phone">${l.phone}</div>
    ${citaTag}
    <div class="card-tags"><span class="tag ${PTAG[l.product]||''}">${l.product}</span></div>
    <div class="card-actions">
      <a class="card-btn card-btn-call" href="tel:${l.phone}" onclick="event.stopPropagation()">📞 Llamar</a>
      <a class="card-btn card-btn-wa" href="https://wa.me/1${l.phone.replace(/\D/g,'')}" target="_blank" onclick="event.stopPropagation()">💬 WA</a>
      <button class="card-btn card-btn-note" onclick="event.stopPropagation();window._openLead('${l.id}')">📝 Ver</button>
    </div>
  </div>`;
}

function renderTable(){
  const data=filtered();
  document.getElementById('tableBody').innerHTML=data.map(l=>{
    const s=STAGES[l.stage];
    const pc=l.priority==='Alta'?'#f44336':l.priority==='Media'?'#ffc107':'#4caf50';
    const cita=l.citaDate?`${fmtDate(l.citaDate)} ${l.citaTime||''}`:'—';
    return`<tr>
      <td><strong>${l.name}</strong></td>
      <td><a href="tel:${l.phone}" style="color:var(--accent);text-decoration:none">${l.phone}</a></td>
      <td><span class="tag ${PTAG[l.product]||''}">${l.product}</span></td>
      <td><span class="stage-badge" style="background:${s.bg};color:${s.color}">${s.label}</span></td>
      <td style="color:#ff9800;font-size:12px">${cita}</td>
      <td><span style="color:${pc};font-weight:700">${l.priority}</span></td>
      <td><div style="display:flex;gap:5px">
        <a href="tel:${l.phone}" class="card-btn card-btn-call" style="padding:4px 8px">📞</a>
        <a href="https://wa.me/1${l.phone.replace(/\D/g,'')}" target="_blank" class="card-btn card-btn-wa" style="padding:4px 8px">💬</a>
        <button class="card-btn card-btn-note" onclick="window._openLead('${l.id}')" style="padding:4px 8px">✏️</button>
      </div></td>
    </tr>`;
  }).join('')||`<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px">No hay leads</td></tr>`;
}

function renderCalendar(){
  const now=new Date();
  const weekStart=new Date(now);
  weekStart.setDate(now.getDate()-now.getDay()+weekOffset*7);
  weekStart.setHours(0,0,0,0);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);
  document.getElementById('calTitle').textContent=`${weekStart.getDate()} ${MONTHS[weekStart.getMonth()]} — ${weekEnd.getDate()} ${MONTHS[weekEnd.getMonth()]} ${weekEnd.getFullYear()}`;
  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const grid=document.getElementById('calWeek');
  grid.innerHTML='';
  for(let i=0;i<7;i++){
    const day=new Date(weekStart);day.setDate(weekStart.getDate()+i);
    const isToday=day.toDateString()===now.toDateString();
    const dayStr=day.toISOString().split('T')[0];
    const dayLeads=leads.filter(l=>l.citaDate===dayStr);
    const col=document.createElement('div');
    col.className='cal-day'+(isToday?' today':'');
    col.innerHTML=`
      <div class="cal-day-label">${days[day.getDay()]}</div>
      <div class="cal-day-num">${day.getDate()}</div>
      ${dayLeads.map(l=>`<div class="cal-event" onclick="window._openLead('${l.id}')">
        <div class="cal-event-name">${l.name}</div>
        <div class="cal-event-time">⏰ ${l.citaTime||'Sin hora'}</div>
      </div>`).join('')}
      ${!dayLeads.length?'<div style="font-size:10px;color:var(--border);margin-top:4px">Sin citas</div>':''}`;
    grid.appendChild(col);
  }
  // Upcoming
  const upcoming=leads
    .filter(l=>l.citaDate&&l.citaDate>=now.toISOString().split('T')[0])
    .sort((a,b)=>a.citaDate.localeCompare(b.citaDate)||(a.citaTime||'').localeCompare(b.citaTime||''))
    .slice(0,10);
  const ul=document.getElementById('upcomingList');
  if(!upcoming.length){ul.innerHTML='<div class="no-citas">📭 No hay citas próximas</div>';return;}
  ul.innerHTML=upcoming.map(l=>{
    const d=new Date(l.citaDate+'T'+(l.citaTime||'00:00'));
    const diff=(d-now)/60000;
    const cls=diff<60&&diff>0?'very-soon':diff<1440?'soon':'';
    return`<div class="upcoming-item ${cls}">
      <div class="upcoming-date-box"><div class="upcoming-date-day">${d.getDate()}</div><div class="upcoming-date-mon">${MONTHS[d.getMonth()]}</div></div>
      <div class="upcoming-info">
        <div class="upcoming-name">${l.name}</div>
        <div class="upcoming-sub">${l.product} · ${l.citaType||''}</div>
        <div class="upcoming-sub">${l.phone}</div>
      </div>
      <div style="text-align:right;margin-right:10px">
        <div style="font-size:13px;font-weight:700;color:var(--accent)">⏰ ${l.citaTime||'Sin hora'}</div>
        ${diff>0&&diff<60?`<div style="font-size:10px;color:var(--red);font-weight:700;margin-top:3px">¡En ${Math.round(diff)} min!</div>`:''}
        ${diff>0&&diff>=60&&diff<1440?`<div style="font-size:10px;color:#ff9800;margin-top:3px">Hoy</div>`:''}
      </div>
      <div class="upcoming-actions">
        <a href="tel:${l.phone}" class="card-btn card-btn-call" style="padding:6px 10px">📞</a>
        <a href="https://wa.me/1${l.phone.replace(/\D/g,'')}" target="_blank" class="card-btn card-btn-wa" style="padding:6px 10px">💬</a>
        <button class="card-btn card-btn-note" onclick="window._openLead('${l.id}')" style="padding:6px 10px">✏️</button>
      </div>
    </div>`;
  }).join('');
}

function fmtDate(d){
  if(!d)return'';
  const[,m,day]=d.split('-');
  return`${day} ${MONTHS[parseInt(m)-1]}`;
}

window.changeWeek=dir=>{if(dir===0)weekOffset=0;else weekOffset+=dir;renderCalendar();};

window.setView=v=>{
  currentView=v;
  document.getElementById('kanbanView').style.display=v==='kanban'?'flex':'none';
  document.getElementById('tableView').classList.toggle('active',v==='table');
  document.getElementById('calendarView').classList.toggle('active',v==='calendar');
  document.getElementById('mainToolbar').style.display=v==='calendar'?'none':'flex';
  document.querySelectorAll('.view-btn').forEach((b,i)=>b.classList.toggle('active',i===['kanban','table','calendar'].indexOf(v)));
  renderAll();
};

function renderAll(){
  renderStats();
  if(currentView==='kanban')renderKanban();
  else if(currentView==='table')renderTable();
  else renderCalendar();
}

async function dropLead(stageId){
  const l=leads.find(x=>x.id===dragId);
  if(!l)return;
  setSyncBadge('saving');
  await updateDoc(doc(db,'jcnay_leads',l.id),{stage:stageId});
  setSyncBadge('saved');
}

window.toggleCitaFields=()=>{
  const s=parseInt(document.getElementById('fStage').value);
  document.getElementById('citaFields').style.display=s===2?'block':'none';
};

window.openNewLead=()=>{
  editingId=null;editingDocId=null;
  document.getElementById('modalTitle').textContent='Nuevo Lead';
  ['fName','fPhone','fEmail','fCoverage','fPremium','fNotes','fCitaDate','fCitaTime'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fProduct').value='IUL';
  document.getElementById('fStage').value='0';
  document.getElementById('fPriority').value='Media';
  document.getElementById('fSource').value='Facebook Ads';
  document.getElementById('citaFields').style.display='none';
  document.getElementById('btnDelete').style.display='none';
  document.getElementById('notesSection').style.display='none';
  document.getElementById('modalActions').style.display='none';
  document.getElementById('leadModal').classList.add('open');
};

window._openLead=id=>{
  const l=leads.find(x=>x.id===id);if(!l)return;
  editingId=id;
  document.getElementById('modalTitle').textContent=l.name;
  document.getElementById('fName').value=l.name;
  document.getElementById('fPhone').value=l.phone;
  document.getElementById('fEmail').value=l.email||'';
  document.getElementById('fProduct').value=l.product;
  document.getElementById('fStage').value=l.stage;
  document.getElementById('fPriority').value=l.priority;
  document.getElementById('fCoverage').value=l.coverage||'';
  document.getElementById('fPremium').value=l.premium||'';
  document.getElementById('fSource').value=l.source||'Facebook Ads';
  document.getElementById('fNotes').value=l.notes||'';
  document.getElementById('fCitaDate').value=l.citaDate||'';
  document.getElementById('fCitaTime').value=l.citaTime||'';
  document.getElementById('fCitaType').value=l.citaType||'Videollamada (Zoom)';
  document.getElementById('citaFields').style.display=l.stage===2?'block':'none';
  document.getElementById('btnDelete').style.display='block';
  document.getElementById('modalActions').style.display='flex';
  document.getElementById('btnCall').href=`tel:${l.phone}`;
  document.getElementById('btnWa').href=`https://wa.me/1${l.phone.replace(/\D/g,'')}`;
  document.getElementById('btnEmail').href=`mailto:${l.email||''}`;
  document.getElementById('notesSection').style.display='block';
  renderNotes(l);
  document.getElementById('leadModal').classList.add('open');
};

function renderNotes(l){
  const list=document.getElementById('notesList');
  if(!l.noteLog||!l.noteLog.length){list.innerHTML='<div style="color:var(--muted);font-size:12px">Sin notas aún.</div>';return;}
  list.innerHTML=l.noteLog.slice().reverse().map(n=>
    `<div class="note-item">${n.text}<div class="note-date">${new Date(n.date).toLocaleString('es-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>`
  ).join('');
}

window.addNote=async()=>{
  const input=document.getElementById('newNoteInput');
  const text=input.value.trim();
  if(!text||!editingId)return;
  const l=leads.find(x=>x.id===editingId);if(!l)return;
  const noteLog=[...(l.noteLog||[]),{text,date:new Date().toISOString()}];
  setSyncBadge('saving');
  await updateDoc(doc(db,'jcnay_leads',editingId),{noteLog});
  setSyncBadge('saved');
  input.value='';
};

window.saveLead=async()=>{
  const name=document.getElementById('fName').value.trim();
  const phone=document.getElementById('fPhone').value.trim();
  if(!name||!phone){alert('Nombre y teléfono son requeridos.');return;}
  const stage=parseInt(document.getElementById('fStage').value);
  const data={
    name,phone,
    email:document.getElementById('fEmail').value,
    product:document.getElementById('fProduct').value,
    stage,priority:document.getElementById('fPriority').value,
    coverage:document.getElementById('fCoverage').value,
    premium:document.getElementById('fPremium').value,
    source:document.getElementById('fSource').value,
    notes:document.getElementById('fNotes').value,
    citaDate:stage===2?document.getElementById('fCitaDate').value:'',
    citaTime:stage===2?document.getElementById('fCitaTime').value:'',
    citaType:stage===2?document.getElementById('fCitaType').value:'',
  };
  setSyncBadge('saving');
  if(editingId){
    await updateDoc(doc(db,'jcnay_leads',editingId),data);
  }else{
    await addDoc(COL,{...data,noteLog:[],created:new Date().toISOString()});
  }
  setSyncBadge('saved');
  closeModal();
};

window.deleteLead=async()=>{
  if(!editingId||!confirm('¿Eliminar este lead permanentemente?'))return;
  setSyncBadge('saving');
  await deleteDoc(doc(db,'jcnay_leads',editingId));
  setSyncBadge('saved');
  closeModal();
};

window.closeModal=()=>{document.getElementById('leadModal').classList.remove('open');editingId=null;};

// Notifications
function playAlert(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784].forEach((freq,i)=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;osc.type='sine';
      gain.gain.setValueAtTime(0.3,ctx.currentTime+i*.15);
      gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+i*.15+.3);
      osc.start(ctx.currentTime+i*.15);osc.stop(ctx.currentTime+i*.15+.3);
    });
  }catch(e){}
}

function showToast(title,body){
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<button class="toast-close" onclick="this.parentElement.remove()">✕</button><div class="toast-title">${title}</div><div class="toast-body">${body}</div>`;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(()=>{if(t.parentElement)t.remove();},8000);
  playAlert();
}

function checkCitas(){
  const now=new Date();
  leads.forEach(l=>{
    if(!l.citaDate||!l.citaTime)return;
    const cita=new Date(l.citaDate+'T'+l.citaTime);
    const diff=(cita-now)/60000;
    const k30=l.id+'_30',k10=l.id+'_10';
    if(diff<=30&&diff>25&&!notifiedIds.has(k30)){
      notifiedIds.add(k30);
      showToast('⏰ Cita en 30 minutos',`${l.name} · ${l.citaTime} · ${l.citaType||''}`);
    }
    if(diff<=10&&diff>5&&!notifiedIds.has(k10)){
      notifiedIds.add(k10);
      showToast('🚨 Cita en 10 minutos',`${l.name} · ${l.citaTime} · ${l.citaType||''}`);
    }
  });
}

document.getElementById('leadModal').addEventListener('click',e=>{if(e.target===document.getElementById('leadModal'))window.closeModal();});
document.getElementById('newNoteInput').addEventListener('keydown',e=>{if(e.key==='Enter')window.addNote();});

if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
setInterval(()=>{checkCitas();if(currentView==='calendar')renderCalendar();},60000);
checkCitas();
</script>
